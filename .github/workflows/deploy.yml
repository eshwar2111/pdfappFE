name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins. That matters
        # here: pdfjs-dist must stay on the version react-pdf was built
        # against, and `npm install` is free to resolve a newer one.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Vite inlines this at build time — it cannot be changed afterwards
          # without rebuilding. It is a public URL, not a secret, but it is
          # stored as a repository variable so it is configured in one place.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # Vite does not copy this: it lives at the repo root, but only the
      # contents of dist/ are uploaded. Without it Static Web Apps has no
      # navigationFallback rule, so a hard refresh on /s/<token> — the guest
      # flow a reviewer will exercise — returns 404 instead of index.html.
      - name: Include Static Web Apps routing config in the output
        run: cp staticwebapp.config.json dist/

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build, app_location is uploaded verbatim and
          # output_location is ignored — so this must point at the built
          # artifact, not the project root. Pointing it at '/' ships the source
          # tree: the browser then loads the unbuilt index.html and fails on
          # /src/main.tsx with a MIME-type error.
          app_location: 'dist'
          skip_app_build: true
          # The build already ran above with VITE_API_BASE_URL set. Letting the
          # action rebuild would drop that variable and ship a bundle that calls
          # its own origin for the API.

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
