name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins. That matters
        # here: pdfjs-dist must stay on the version react-pdf was built
        # against, and `npm install` is free to resolve a newer one.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Vite inlines this at build time — it cannot be changed afterwards
          # without rebuilding. It is a public URL, not a secret, but it is
          # stored as a repository variable so it is configured in one place.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          output_location: 'dist'
          # The build already ran above, with the environment it needs. Oryx
          # would otherwise rebuild without VITE_API_BASE_URL and ship a bundle
          # that calls its own origin for the API.
          skip_app_build: true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
